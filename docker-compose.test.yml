version: '3.8'

services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: doceater-postgres-test
    environment:
      POSTGRES_DB: doceater
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doceater"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data:
